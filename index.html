<div class="fx"><span>${T("gam")}</span><b>${sc.gam}/100</b></div><div class="fx"><span>${T("pr")}</span><b>${sc.pr}/100</b></div><div class="fx"><span>${T("cmp")}</span><b>${sc.cmp}/100</b></div><div class="fx"><span>${T("score")}</span><b>${R.all}/100</b></div>
<table><tr><th>${T("fpsn")} (${RESL["1080p"]} · HIGH)</th><th>FPS</th></tr>${GAMES.map(([n,m])=>`<tr><td>${n}</td><td>~${Math.round(R.base*m)}</td></tr>`).join("")}</table>
<p><b>${T("compat")}</b></p>${R.is.filter(x=>x.s).map(x=>`<p>${["✓","⚠","✕"][x.s]} ${msg(x)[0]} — ${msg(x)[2]}</p>`).join("")||"<p>✓ OK</p>"}<p><b>${T("rec")}:</b> ${L.r[R.rec]}</p>${ups.map(u=>`<p>• ${nm(u.from)} → ${nm(u.to)}: ${T(u.why)}</p>`).join("")}<p><small>${T("est")}</small></p><p style="text-align:center">Thanks for coming! / ¡Gracias por venir!</p>`;print()}

/* ============ 10. ADMIN ============ */
function admin(ok){const d=$("#dl");d.innerHTML=ok?`<h2>${t("adm")}</h2><label for="ab">${t("bmax")}</label><input id="ab" type="number" min="0" step="1000" value="${st.maxB||0}"><label for="np">PIN</label><input id="np" type="text" inputmode="numeric" value="${DB.pin}"><label for="ac">${t("cnt")}</label><div class="row"><input id="ac" type="number" min="0" step="1" value="${+ls("nb")||0}" style="flex:1"><button class="btn" data-act="azero">${t("zero")}</button></div><h3 style="margin-top:14px">${t("prices")}</h3>${CATS.map(k=>`<details><summary class="adm">${t("cat_"+k)}</summary>${DB[k].map((o,i)=>`<label for="p_${k}_${i}">${nm(o)}</label><input id="p_${k}_${i}" type="number" min="0" step="1000" data-pk="${k}" data-pi="${i}" value="${o.p}">`).join("")}</details>`).join("")}<p id="er" class="ba" role="alert"></p><div class="row"><button class="btn pri" data-act="asave">${t("save")}</button><button class="btn" data-act="aclose">${t("close")}</button></div>`
:`<h2>${t("adm")}</h2><label for="pin0">PIN</label><input id="pin0" type="password" inputmode="numeric" autocomplete="off"><p id="er" class="ba" role="alert"></p><div class="row"><button class="btn pri" data-act="aok">${t("enter")}</button><button class="btn" data-act="aclose">${t("close")}</button></div>`;if(!d.open)d.showModal();(ok?$("#ab"):$("#pin0")).focus()}
function asave(){const e=$("#er"),b=Number($("#ab").value),p=$("#np").value.trim(),c=Number($("#ac").value),pr=[...document.querySelectorAll("#dl [data-pk]")];
if(!(b>=0&&Number.isFinite(b)))return e.textContent=t("ebud");if(!/^\d{4,8}$/.test(p))return e.textContent=t("e2");if(!Number.isInteger(c)||c<0||c>999999)return e.textContent=t("e3");
if(pr.some(i=>i.value===""||!Number.isFinite(+i.value)||+i.value<0))return e.textContent=t("eprice");
const ov={};pr.forEach(i=>{const k=i.dataset.pk,n=+i.dataset.pi;DB[k][n].p=Math.round(+i.value);(ov[k]=ov[k]||[])[n]=DB[k][n].p});
DB.pin=p;ls("pin",p);ls("nb",c);ls("prices",JSON.stringify(ov));$("#mb").value=b||"";$("#dl").close();st.R=null;setBudget(b);upd();rMine()}

/* ============ 11. EVENTOS ============ */
const ACT={
lang(){st.L=st.L=="es"?"en":"es";ls("lang",st.L);render()},
theme(){const h=document.documentElement,n=h.dataset.theme=="dark"?"light":"dark";h.dataset.theme=n;ls("theme",n)},
lite(){document.body.classList.toggle("lite");ls("lite",lite()?1:0);rHeader();rTop()},
kiosk(){st.kiosk=!st.kiosk;document.body.classList.toggle("kiosk",st.kiosk);if(st.kiosk&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else if(!st.kiosk&&document.fullscreenElement)document.exitFullscreen();rHeader();rTop();bump()},
admin:()=>admin(false),aok(){$("#pin0").value===DB.pin?admin(true):$("#er").textContent=t("ebad")},asave,aclose:()=>$("#dl").close(),vclose:()=>$("#sm").close(),
azero(){$("#ac").value=0;toast(t("zero"))},
calc,print:sheet,sur:surprise,copy(){const R=ensureR();if(R)copy(text(R))},share,save:saveDlg,dosave:doSave,
reset(){document.querySelectorAll("dialog[open]").forEach(d=>d.close());resetAll()},
view(){$("#sm").innerHTML=`<h2>${t("summ")}</h2>${sumHTML(st.V.A)}<div class="row" style="margin-top:12px"><button class="btn" data-act="calc">${t("calc")}</button><button class="btn" data-act="vclose">${t("close")}</button></div>`;$("#sm").showModal()},
pre(b){const s={};PRE[b.dataset.p].forEach((v,i)=>s[CATS[i]]=v);setSel(s)},
pick(b){const k=b.dataset.k,i=+b.dataset.i,s={...st.S};if(s[k]===i)delete s[k];else s[k]=i;st.open.add(k);setSel(s)},
bud(b){$("#mb").value=b.dataset.v;setBudget(+b.dataset.v)},
gq(b){st.preset=b.dataset.q;rRes()},gr(b){st.res=b.dataset.r;rRes()},
draw(){const g=GL[Math.floor(Math.random()*GL.length)],es=st.L=="es";$("#gc").innerHTML=`<div class="it" style="margin-top:10px"><b style="font-size:20px">${g[0]}</b><br>${es?g[1]:g[0]}<br><small>${es?g[2]:g[3]}</small></div>`},
load:b=>loadB(+b.dataset.i),del(b){const x=builds();x.splice(+b.dataset.i,1);ls("builds",JSON.stringify(x));rMine()}};
function surprise(){let s,i=0;do{s={};CATS.forEach(k=>s[k]=Math.floor(Math.random()*DB[k].length))}while(chk(s).some(x=>x.s==2)&&++i<80);setSel(s)}
function resetAll(){st.S={};st.R=null;st.q="";st.f={};st.onlyC=false;persist();rTools();upd();scrollTo(0,0)}
function bump(){clearTimeout(st.idle);if(st.kiosk||st.R)st.idle=setTimeout(resetAll,90000)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b){ACT[b.dataset.act](b);bump()}});
document.addEventListener("toggle",e=>{const d=e.target;if(d.classList&&d.classList.contains("cat"))d.open?st.open.add(d.dataset.k):st.open.delete(d.dataset.k)},true);
document.addEventListener("input",e=>{const i=e.target;if(i.id=="mb")setBudget(+i.value);if(i.id=="q"){st.q=i.value;rConfig()}});
document.addEventListener("change",e=>{const i=e.target;if(i.id=="oc"){st.onlyC=i.checked;rConfig()}if(i.dataset&&i.dataset.fk){st.f[i.dataset.fk]=i.value;rConfig()}});
document.addEventListener("fullscreenchange",()=>{if(st.kiosk&&!document.fullscreenElement){st.kiosk=false;document.body.classList.remove("kiosk");rHeader();rTop()}});
addEventListener("keydown",bump);addEventListener("pointerdown",bump);

/* ============ 12. INICIO ============ */
(function init(){st.L=ls("lang")||(/^en/i.test(navigator.language)?"en":"es");document.documentElement.dataset.theme=ls("theme")||"dark";if(ls("lite")==="1")document.body.classList.add("lite");
const p=ls("pin");if(p)DB.pin=p;try{const ov=JSON.parse(ls("prices")||"{}");Object.keys(ov).forEach(k=>DB[k]&&ov[k].forEach((v,i)=>{if(DB[k][i]&&Number.isFinite(v)&&v>=0)DB[k][i].p=v}))}catch(e){}
let s={},b=0;try{const h=new URLSearchParams(location.hash.slice(1)),c=h.get("build");if(c){c.split(",").forEach((v,i)=>{if(v!="-"&&CATS[i])s[CATS[i]]=+v});s=sanitize(s);b=+h.get("budget")||0}else{const cur=JSON.parse(ls("cur")||"{}");s=sanitize(cur.s);b=+cur.b||0}}catch(e){}
st.S=s;st.maxB=Math.max(0,b);render()})();
</script></body></html>
